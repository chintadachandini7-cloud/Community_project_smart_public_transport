<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductor Login - Smart Transit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        .login-box h2 { margin-top: 0; color: #333; text-align: center; border-bottom: 2px solid #ffc107; padding-bottom: 10px;}
        input { width: 100%; margin-bottom: 15px; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; background-color: #ffc107; color: #333; font-weight:bold; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Conductor Login</h2>
        <form method="POST">
            <input type="text" name="phone" placeholder="Phone Number (e.g. 0987654321)" required>
            <input type="password" name="password" placeholder="Password (e.g. password123)" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
